# roles/docker/tasks/main.yaml

- name: Create and set permissions on keyring directory
  file:
    state: directory
    mode: "0755"
    path: /etc/apt/keyrings

- name: Download Docker gpg keyring
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.gpg
    mode: "0444"

- name: Add the official Docker CE repository
  apt_repository:
    filename: docker.list
    repo: deb [arch={{ansible_architecture}} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ansible_distribution_release}} stable

- name: Ensure Docker is installed
  apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Add current user to Docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes
